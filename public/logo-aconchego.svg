<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2a20"/>
      <stop offset="100%" stop-color="#241811"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8a34c"/>
      <stop offset="100%" stop-color="#c9812f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2c879"/>
      <stop offset="50%" stop-color="#e8a34c"/>
      <stop offset="100%" stop-color="#f2c879"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bgGrad)"/>

  <!-- circular frame -->
  <circle cx="300" cy="245" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.55"/>

  <!-- house / roof icon symbolizing "aconchego" (coziness) -->
  <g>
    <!-- roof -->
    <path d="M300 130 L400 205 L385 205 L385 240 L215 240 L215 205 L200 205 Z" fill="url(#roofGrad)"/>
    <!-- chimney -->
    <rect x="355" y="150" width="16" height="35" fill="#c9812f"/>
    <!-- house body -->
    <rect x="225" y="240" width="150" height="95" rx="4" fill="#f7e6cc"/>
    <!-- door -->
    <path d="M285 335 L285 285 Q285 270 300 270 Q315 270 315 285 L315 335 Z" fill="#8a5a34"/>
    <!-- windows -->
    <rect x="242" y="258" width="26" height="26" rx="3" fill="#c9812f"/>
    <rect x="332" y="258" width="26" height="26" rx="3" fill="#c9812f"/>
    <!-- heart above door: coziness / warmth symbol -->
    <path d="M300 235 c-8,-12 -26,-12 -26,4 c0,14 26,28 26,28 c0,0 26,-14 26,-28 c0,-16 -18,-16 -26,-4 Z" fill="#e8a34c"/>
  </g>

  <!-- text: HOTEL -->
  <text x="300" y="435" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="10" fill="#f2c879" text-anchor="middle" font-weight="600">HOTEL</text>
  <!-- text: ACONCHEGO -->
  <text x="300" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="6" fill="#f7e6cc" text-anchor="middle">ACONCHEGO</text>

  <!-- decorative line -->
  <line x1="220" y1="500" x2="380" y2="500" stroke="url(#goldGrad)" stroke-width="2"/>
</svg>
